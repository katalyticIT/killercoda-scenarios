apiVersion: v1
kind: Pod
metadata:
  name: pod-required
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: location
            operator: In
            values:
            - room-green
            - room-yellow
  containers:
  - name: logger
    image: busybox:1.36
    env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    command: ["/bin/sh", "-c"]
    args:
    - 'while true; do echo "$(date +%H:%M:%S) - [required] Pod laeuft auf Node: $NODE_NAME"; sleep 5; done'