apiVersion: v1
kind: Pod
metadata:
  name: pod-blue-vip
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: location
            operator: In
            values:
            - room-blue
  tolerations:
  - key: "access"
    operator: "Equal"
    value: "restricted"
    effect: "NoSchedule"
  containers:
  - name: logger
    image: busybox:1.36
    env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    command: ["/bin/sh", "-c"]
    args:
    - 'while true; do echo "$(date +%H:%M:%S) - [vip] Pod laeuft auf Node: $NODE_NAME"; sleep 5; done'