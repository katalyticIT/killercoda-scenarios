apiVersion: v1
kind: Pod
metadata:
  name: pod-blue
spec:
  nodeSelector:
    location: room-blue
  containers:
  - name: logger
    image: busybox:1.36
    env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    command: ["/bin/sh", "-c"]
    args:
    - while true; do echo "$(date '+%H:%M:%S') - Pod läuft auf Node: $NODE_NAME"; sleep 5; done
